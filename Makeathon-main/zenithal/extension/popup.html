<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; margin: 0; font-family: system-ui, sans-serif; background: #0b1120; color: #e2e8f0; }
      header { padding: 12px 14px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; }
      header b { font-size: 14px; }
      header span { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .06em; }
      .body { padding: 14px; }
      input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 13px; }
      button { margin-top: 8px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #06b6d4; color: #0b1120; font-weight: 600; cursor: pointer; }
      button:hover { background: #22d3ee; }
      .verdict { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; }
      .MALICIOUS { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
      .SUSPICIOUS { background: rgba(249,115,22,.12); color: #fdba74; border: 1px solid rgba(249,115,22,.4); }
      .SAFE { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.4); }
      .ERROR { background: rgba(148,163,184,.12); color: #cbd5e1; border: 1px solid rgba(148,163,184,.4); }
      .reasons { margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: #94a3b8; }
      .score { font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <span style="font-size:18px">🛡️</span>
      <div><b>Zenithal</b><br /><span>URL Threat Guard</span></div>
    </header>
    <div class="body">
      <input id="url" placeholder="URL to scan (defaults to current tab)" />
      <button id="scan">Scan URL</button>
      <div id="out"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
